<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Meeting notification sound</title>
<style>
body{margin:0;font:14px Arial,sans-serif;color:#555}
button{background:#1c3e82;color:white;border:0;border-radius:5px;padding:8px 12px;cursor:pointer;font-weight:bold}
button:focus-visible{outline:3px solid #36b583;outline-offset:2px}
small{display:block;margin-top:5px}
</style></head>
<body><button id="sound" type="button">🔔 Enable notification sound</button>
<small id="hint">Optional: click to enable a short ping in this tab.</small>
<script>
let context=null, enabled=false, lastEvent=null;
const button=document.getElementById("sound"), hint=document.getElementById("hint");
function send(type,extra={}){window.parent.postMessage({isStreamlitMessage:true,type,...extra},"*")}
async function ping(){
  if(!enabled || !context)return;
  try{
    await context.resume();
    if(context.state!=="running"){hint.textContent="Click the sound button again to allow audio.";return;}
    const start=context.currentTime;
    [660,880].forEach((frequency,index)=>{
      const oscillator=context.createOscillator(),gain=context.createGain();
      oscillator.type="sine";oscillator.frequency.value=frequency;
      gain.gain.setValueAtTime(0,start+index*.16);
      gain.gain.linearRampToValueAtTime(.12,start+index*.16+.02);
      gain.gain.exponentialRampToValueAtTime(.001,start+index*.16+.15);
      oscillator.connect(gain);gain.connect(context.destination);
      oscillator.start(start+index*.16);oscillator.stop(start+index*.16+.16);
    });
  }catch(error){hint.textContent="Audio is blocked here. Try opening the app in a full tab.";}
}
button.addEventListener("click",async()=>{
  if(enabled){enabled=false;button.textContent="🔔 Enable notification sound";hint.textContent="Sound is off.";return;}
  try{
    const AudioAPI=window.AudioContext||window.webkitAudioContext;
    if(!AudioAPI)throw new Error("Unavailable");
    context=context||new AudioAPI();await context.resume();enabled=true;
    button.textContent="🔕 Mute notification sound";hint.textContent="Sound enabled for this tab. A new alert plays one short ping.";
    await ping();
  }catch(error){hint.textContent="Your browser blocked audio. Open the app in a full tab and try again.";}
});
window.addEventListener("message",event=>{
  if(event.source!==window.parent || event.data.type!=="streamlit:render")return;
  const current=event.data.args.event;
  if(lastEvent!==null && current!==lastEvent && event.data.args.has_alerts)ping();
  lastEvent=current;
  send("streamlit:setFrameHeight",{height:68});
});
send("streamlit:componentReady",{apiVersion:1});
send("streamlit:setFrameHeight",{height:68});
</script></body></html>
